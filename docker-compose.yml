services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-changeradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeradar}
      POSTGRES_DB: ${POSTGRES_DB:-changeradar}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-changeradar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # minio/minio is no longer published on Docker Hub; Chainguard's public build is
    # the same server. It has no shell or curl, so there is no container healthcheck;
    # dependents use service_started (the app creates its bucket on first use).
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-changeradar}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-changeradar-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # One-shot: applies Alembic migrations, then exits. api and worker wait on it.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    command: alembic -c migrations/alembic.ini upgrade head
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: celery -A src.celery_app worker --loglevel=info
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach scripts/demo_store.py on the host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  beat:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: celery -A src.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time; changing it requires a rebuild.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
