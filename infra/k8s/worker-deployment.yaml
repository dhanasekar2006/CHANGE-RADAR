apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: changeradar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: changeradar/worker:latest
          command: ["celery", "-A", "src.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: changeradar-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  namespace: changeradar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beat
  template:
    metadata:
      labels:
        app: beat
    spec:
      containers:
        - name: beat
          image: changeradar/worker:latest
          command: ["celery", "-A", "src.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: changeradar-secrets
