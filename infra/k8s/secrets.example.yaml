# Copy to secrets.yaml (gitignored) and fill in real values, or generate
# with `kubectl create secret generic changeradar-secrets --from-env-file=.env`.
apiVersion: v1
kind: Secret
metadata:
  name: changeradar-secrets
  namespace: changeradar
type: Opaque
stringData:
  SECRET_KEY: change-me
  DATABASE_URL: postgresql+asyncpg://changeradar:changeradar@postgres:5432/changeradar
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  S3_ACCESS_KEY: changeradar
  S3_SECRET_KEY: changeradar-secret
  ANTHROPIC_API_KEY: ""
