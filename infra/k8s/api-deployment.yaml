apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: changeradar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: changeradar/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: changeradar-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: changeradar
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
