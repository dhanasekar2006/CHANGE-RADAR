apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: changeradar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: changeradar/web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: changeradar
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
