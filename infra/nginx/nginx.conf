# Production edge reverse proxy: terminates TLS, routes /api to the api
# service and everything else to the web service's static build.
# Not used by docker-compose.yml (each service is exposed on its own port
# there for local dev) — wire this in for a single public-facing deployment.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream api_upstream {
        server api:8000;
    }

    upstream web_upstream {
        server web:80;
    }

    server {
        listen 443 ssl;
        server_name changeradar.example;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /api/ {
            proxy_pass http://api_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web_upstream/;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 80;
        server_name changeradar.example;
        return 301 https://$host$request_uri;
    }
}
