global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: changeradar-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: changeradar-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9540"] # celery-exporter, if enabled

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
