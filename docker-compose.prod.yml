# Single-server production stack: the whole app behind Caddy with automatic HTTPS.
#
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only ports 80/443 are published; postgres, redis, minio, api and web are reachable
# on the internal network only. See docs/deployment.md.

x-app-env: &app-env
  env_file: .env.production
  environment:
    ENVIRONMENT: production
    # Built from the same variables postgres is initialised with so they can't drift.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    S3_ENDPOINT_URL: http://minio:9000
    CORS_ORIGINS: https://${DOMAIN}
    BUILD_VERSION: ${BUILD_VERSION:-prod}
    BUILD_COMMIT: ${BUILD_COMMIT:-unknown}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Snapshot storage. To use a managed bucket (S3/R2/GCS) instead: delete this service,
  # drop minio from the worker/beat depends_on, and replace the S3_ENDPOINT_URL override
  # in x-app-env with the provider's endpoint plus real S3_* credentials.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - miniodata:/data

  migrate:
    <<: *app-env
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    command: alembic -c migrations/alembic.ini upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-env
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # --proxy-headers: trust Caddy's X-Forwarded-For so the per-IP rate limit sees real
    # client IPs instead of Caddy's. Safe because the api isn't published to the host.
    command: >
      uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2
      --proxy-headers --forwarded-allow-ips "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app-env
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    command: celery -A src.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # Exactly one beat: a second scheduler double-enqueues every job.
  beat:
    <<: *app-env
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    command: celery -A src.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Same origin as the site; Caddy routes /api to the api service.
        VITE_API_BASE_URL: https://${DOMAIN:?set DOMAIN}/api
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
